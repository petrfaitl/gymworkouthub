<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leg Day Infographic</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'media',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#fff7ed',
                            100: '#ffedd5',
                            200: '#fed7aa',
                            300: '#fdba74',
                            400: '#fb923c',
                            500: '#f97316',
                            600: '#ea580c',
                            700: '#c2410c',
                            800: '#9a3412',
                            900: '#7c2d12',
                            950: '#431407',
                        },
                    },
                },
            },
        }
    </script>
    <style>
        body {
            font-family: -apple-system, 'Segoe UI', Roboto, system-ui, sans-serif;
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-screen transition-colors duration-300">
    <div class="mx-auto max-w-3xl px-4 py-8 md:py-12 pb-32">
        <!-- Back Link -->
        <a href="index.html" class="inline-flex items-center gap-2 mb-8 text-sm font-semibold text-slate-500 dark:text-slate-400 hover:text-brand-600 dark:hover:text-brand-400 transition-colors">
            ← Back to Dashboard
        </a>

        <!-- Infographic Card -->
        <div class="relative overflow-hidden rounded-[2.5rem] bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-2xl p-8 md:p-12">
            
            <header class="text-center mb-10 pb-8 border-b-4 border-orange-500">
                <h1 class="text-3xl md:text-4xl font-black uppercase tracking-tighter text-slate-900 dark:text-white mb-2">
                    Lower Body Circuit
                </h1>
                <p class="text-lg font-bold uppercase tracking-widest text-orange-500 italic">
                    Strength & Power
                </p>
            </header>

            <div class="space-y-4">
                
                <div data-exercise-card class="group flex items-center gap-6 p-6 rounded-3xl bg-slate-50 dark:bg-slate-800/50 border border-slate-100 dark:border-slate-800 hover:border-orange-500 transition-all hover:translate-x-2">
                    <div class="flex-shrink-0 w-16 h-16 rounded-full border-4 border-orange-500 flex items-center justify-center text-2xl font-black text-orange-500 bg-white dark:bg-slate-900 shadow-lg">1</div>
                    <div>
                        <h3 class="text-xl font-black text-slate-900 dark:text-white uppercase tracking-tight">Glute Bridge</h3>
                        <p class="text-orange-600 dark:text-orange-400 font-black text-sm tracking-widest italic uppercase mb-3">x 12 Reps</p>
                        <a class="inline-flex items-center gap-2 px-4 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 text-brand-600 dark:text-brand-400 text-xs font-bold border border-slate-100 dark:border-slate-700 hover:bg-brand-50 dark:hover:bg-brand-900/20 transition-colors" href="https://www.youtube.com/results?search_query=glute+bridge" target="_blank">
                            <span class="text-[10px]">▶</span> Watch demo
                        </a>
                    </div>
                </div>

                <div data-exercise-card class="group flex items-center gap-6 p-6 rounded-3xl bg-slate-50 dark:bg-slate-800/50 border border-slate-100 dark:border-slate-800 hover:border-orange-500 transition-all hover:translate-x-2">
                    <div class="flex-shrink-0 w-16 h-16 rounded-full border-4 border-orange-500 flex items-center justify-center text-2xl font-black text-orange-500 bg-white dark:bg-slate-900 shadow-lg">2</div>
                    <div>
                        <h3 class="text-xl font-black text-slate-900 dark:text-white uppercase tracking-tight">Single Leg RDL</h3>
                        <p class="text-orange-600 dark:text-orange-400 font-black text-sm tracking-widest italic uppercase mb-3">x 8 Reps</p>
                        <a class="inline-flex items-center gap-2 px-4 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 text-brand-600 dark:text-brand-400 text-xs font-bold border border-slate-100 dark:border-slate-700 hover:bg-brand-50 dark:hover:bg-brand-900/20 transition-colors" href="https://www.youtube.com/watch?v=fkej6PUmvmc" target="_blank">
                            <span class="text-[10px]">▶</span> Watch demo
                        </a>
                    </div>
                </div>

                <div data-exercise-card class="group flex items-center gap-6 p-6 rounded-3xl bg-slate-50 dark:bg-slate-800/50 border border-slate-100 dark:border-slate-800 hover:border-orange-500 transition-all hover:translate-x-2">
                    <div class="flex-shrink-0 w-16 h-16 rounded-full border-4 border-orange-500 flex items-center justify-center text-2xl font-black text-orange-500 bg-white dark:bg-slate-900 shadow-lg">3</div>
                    <div>
                        <h3 class="text-xl font-black text-slate-900 dark:text-white uppercase tracking-tight">Lunge</h3>
                        <p class="text-orange-600 dark:text-orange-400 font-black text-sm tracking-widest italic uppercase mb-3">x 10 Reps</p>
                        <a class="inline-flex items-center gap-2 px-4 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 text-brand-600 dark:text-brand-400 text-xs font-bold border border-slate-100 dark:border-slate-700 hover:bg-brand-50 dark:hover:bg-brand-900/20 transition-colors" href="https://www.youtube.com/results?search_query=lunges" target="_blank">
                            <span class="text-[10px]">▶</span> Watch demo
                        </a>
                    </div>
                </div>

                <div data-exercise-card class="group flex items-center gap-6 p-6 rounded-3xl bg-slate-50 dark:bg-slate-800/50 border border-slate-100 dark:border-slate-800 hover:border-orange-500 transition-all hover:translate-x-2">
                    <div class="flex-shrink-0 w-16 h-16 rounded-full border-4 border-orange-500 flex items-center justify-center text-2xl font-black text-orange-500 bg-white dark:bg-slate-900 shadow-lg">4</div>
                    <div>
                        <h3 class="text-xl font-black text-slate-900 dark:text-white uppercase tracking-tight">Copenhagen Plank</h3>
                        <p class="text-orange-600 dark:text-orange-400 font-black text-sm tracking-widest italic uppercase mb-3">x 20s each side</p>
                        <a class="inline-flex items-center gap-2 px-4 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 text-brand-600 dark:text-brand-400 text-xs font-bold border border-slate-100 dark:border-slate-700 hover:bg-brand-50 dark:hover:bg-brand-900/20 transition-colors" href="https://www.youtube.com/results?search_query=copenhagen+plank" target="_blank">
                            <span class="text-[10px]">▶</span> Watch demo
                        </a>
                    </div>
                </div>

                <div data-exercise-card class="group flex items-center gap-6 p-6 rounded-3xl bg-slate-50 dark:bg-slate-800/50 border border-slate-100 dark:border-slate-800 hover:border-orange-500 transition-all hover:translate-x-2">
                    <div class="flex-shrink-0 w-16 h-16 rounded-full border-4 border-orange-500 flex items-center justify-center text-2xl font-black text-orange-500 bg-white dark:bg-slate-900 shadow-lg">5</div>
                    <div>
                        <h3 class="text-xl font-black text-slate-900 dark:text-white uppercase tracking-tight">Jump Squat</h3>
                        <p class="text-orange-600 dark:text-orange-400 font-black text-sm tracking-widest italic uppercase mb-3">x 20s</p>
                        <a class="inline-flex items-center gap-2 px-4 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 text-brand-600 dark:text-brand-400 text-xs font-bold border border-slate-100 dark:border-slate-700 hover:bg-brand-50 dark:hover:bg-brand-900/20 transition-colors" href="https://www.youtube.com/results?search_query=jump+squat" target="_blank">
                            <span class="text-[10px]">▶</span> Watch demo
                        </a>
                    </div>
                </div>

            </div>

            <footer class="mt-12 p-6 rounded-3xl bg-orange-500 shadow-xl shadow-orange-500/20 text-center">
                <p class="text-xl md:text-2xl font-black text-white uppercase tracking-[0.2em]">
                    4 Rounds | Rest 30s
                </p>
            </footer>

        </div>
    </div>

    <!-- Session Controls -->
    <div id="session-controls" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 w-[90%] max-w-md bg-white/80 dark:bg-slate-900/80 backdrop-blur-md border border-slate-200 dark:border-slate-800 rounded-2xl shadow-2xl p-4 flex items-center justify-between gap-4 transition-all opacity-0 translate-y-4 pointer-events-none">
        <div class="flex items-center gap-3">
            <label class="relative inline-flex items-center cursor-pointer">
                <input type="checkbox" id="wake-lock-toggle" class="sr-only peer">
                <div class="w-11 h-6 bg-slate-200 peer-focus:outline-none rounded-full peer dark:bg-slate-700 peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all dark:border-gray-600 peer-checked:bg-brand-600"></div>
                <span class="ml-3 text-sm font-semibold text-slate-700 dark:text-slate-300">Keep Awake</span>
            </label>
        </div>
        <div class="flex items-center gap-4">
            <span id="progress-text" class="text-sm font-bold text-slate-500 tracking-tight">0/0 Done</span>
            <button id="reset-session" class="flex items-center justify-center w-8 h-8 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400 hover:text-rose-600 transition-colors" title="Reset Session">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path></svg>
            </button>
        </div>
    </div>

    <script src="scripts/session-controls.js"></script>
</body>
</html>
