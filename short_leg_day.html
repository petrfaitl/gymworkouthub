<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leg Day Infographic</title>
<style>
body {
font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
background-color: #111;
display: flex;
justify-content: center;
align-items: center;
min-height: 100vh;
margin: 0;
padding: 20px;
}
.infographic {
background-color: #1a1a1a;
max-width: 500px;
width: 100%;
border-radius: 15px;
padding: 25px;
box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
border: 1px solid #333;
}
.header {
text-align: center;
margin-bottom: 25px;
border-bottom: 2px solid #00ff99;
padding-bottom: 15px;
}
.header h1 {
color: #fff;
margin: 0;
font-size: 28px;
text-transform: uppercase;
letter-spacing: 2px;
}
.header p {
color: #aaa;
margin: 5px 0 0;
font-size: 14px;
text-transform: uppercase;
letter-spacing: 1px;
}
.exercise {
display: flex;
align-items: center;
background-color: #2a2a2a;
margin-bottom: 15px;
padding: 15px;
border-radius: 8px;
border-left: 5px solid #00ff99;
transition: transform 0.2s;
}
.exercise:hover {
transform: translateX(5px);
}
.num {
background-color: #1a1a1a;
color: #00ff99;
border: 2px solid #00ff99;
font-size: 24px;
font-weight: bold;
width: 50px;
height: 50px;
border-radius: 50%;
display: flex;
justify-content: center;
align-items: center;
margin-right: 15px;
flex-shrink: 0;
}
.details {
flex-grow: 1;
}
.name {
font-size: 20px;
font-weight: bold;
color: #fff;
margin: 0;
}
.specs {
font-size: 14px;
color: #00ff99;
font-weight: 500;
margin: 2px 0 0;
}
.footer {
text-align: center;
margin-top: 25px;
font-size: 18px;
font-weight: bold;
color: #111;
background-color: #00ff99;
padding: 10px;
border-radius: 8px;
text-transform: uppercase;
letter-spacing: 1px;
}
</style>
</head>
<body>

<div class="infographic">
<div class="header">
<h1>Lower Body Circuit</h1>
<p>Strength & Power</p>
</div>

<div class="exercise">
<div class="num">1</div>
<div class="details">
<div class="name">Glute Bridge</div>
<div class="specs">x 12 Reps</div>
</div>
</div>

<div class="exercise">
<div class="num">2</div>
<div class="details">
<div class="name">Single Leg RDL</div>
<div class="specs">x 8 Reps</div>
</div>
</div>

<div class="exercise">
<div class="num">3</div>
<div class="details">
<div class="name">Lunge</div>
<div class="specs">x 10 Reps</div>
</div>
</div>

<div class="exercise">
<div class="num">4</div>
<div class="details">
<div class="name">Copenhagen Plank</div>
<div class="specs">x 20s each side</div>
</div>
</div>

<div class="exercise">
<div class="num">5</div>
<div class="details">
<div class="name">Jump Squat</div>
<div class="specs">x 20s</div>
</div>
</div>

<div class="footer">4 Rounds | Rest 30s</div>
</div>

</body>
</html>
