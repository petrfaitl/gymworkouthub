<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>💪 Workout Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'media',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            200: '#bae6fd',
                            300: '#7dd3fc',
                            400: '#38bdf8',
                            500: '#0ea5e9',
                            600: '#0284c7',
                            700: '#0369a1',
                            800: '#075985',
                            900: '#0c4a6e',
                            950: '#082f49',
                        },
                    },
                },
            },
        }
    </script>
    <style>
        /* Keep only base font and essential transitions that Tailwind doesn't handle natively for interactivity */
        body {
            font-family: -apple-system, 'Segoe UI', Roboto, system-ui, sans-serif;
        }
        .filter-chip.active {
            @apply bg-brand-100 dark:bg-brand-900/30 border-brand-500 text-brand-700 dark:text-brand-300 ring-1 ring-brand-500;
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-screen transition-colors duration-300">

    <div class="mx-auto max-w-3xl px-4 py-8 md:py-12">

        <!-- ─── HEADER ─── -->
        <header class="flex flex-wrap items-end justify-between gap-2 pb-6 mb-8 border-b-2 border-slate-200 dark:border-slate-800">
            <div>
                <h1 class="text-3xl font-extrabold tracking-tight bg-gradient-to-br from-slate-900 to-slate-600 dark:from-white dark:to-slate-400 bg-clip-text text-transparent">
                    🏋️ Workout Hub
                </h1>
                <p class="text-sm font-medium text-slate-500 dark:text-slate-400 tracking-wide">
                    Tap a plan & hit the gym
                </p>
            </div>
            <div id="countBadge" class="px-4 py-1 text-sm font-semibold rounded-full bg-slate-200 dark:bg-slate-800 text-slate-700 dark:text-slate-300 border border-slate-300 dark:border-slate-700 whitespace-nowrap">
                9 plans
            </div>
        </header>

        <!-- ─── SEARCH ─── -->
        <div class="relative mb-6">
            <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-xl opacity-60 pointer-events-none">🔍</span>
            <input type="text" id="searchInput" placeholder="Search workouts…" autocomplete="off" 
                class="w-full py-3.5 pl-12 pr-4 text-lg font-medium rounded-2xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 text-slate-900 dark:text-slate-100 placeholder-slate-400 dark:placeholder-slate-500 outline-none focus:ring-4 focus:ring-brand-500/20 focus:border-brand-500 transition-all" />
        </div>

        <!-- ─── FILTERS ─── -->
        <div class="flex flex-wrap gap-2 mb-8" id="filterRow">
            <span class="filter-chip active cursor-pointer px-4 py-1.5 rounded-full text-sm font-medium bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-slate-600 dark:text-slate-400 hover:border-slate-300 dark:hover:border-slate-700 transition-all select-none" data-filter="all">All</span>
            <span class="filter-chip cursor-pointer px-4 py-1.5 rounded-full text-sm font-medium bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-slate-600 dark:text-slate-400 hover:border-slate-300 dark:hover:border-slate-700 transition-all select-none" data-filter="legs">🦵 Legs</span>
            <span class="filter-chip cursor-pointer px-4 py-1.5 rounded-full text-sm font-medium bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-slate-600 dark:text-slate-400 hover:border-slate-300 dark:hover:border-slate-700 transition-all select-none" data-filter="runner">🏃 Runner</span>
            <span class="filter-chip cursor-pointer px-4 py-1.5 rounded-full text-sm font-medium bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-slate-600 dark:text-slate-400 hover:border-slate-300 dark:hover:border-slate-700 transition-all select-none" data-filter="tri">🚴 Tri</span>
            <span class="filter-chip cursor-pointer px-4 py-1.5 rounded-full text-sm font-medium bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-slate-600 dark:text-slate-400 hover:border-slate-300 dark:hover:border-slate-700 transition-all select-none" data-filter="cyclist">🚴 Cyclist</span>
            <span class="filter-chip cursor-pointer px-4 py-1.5 rounded-full text-sm font-medium bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-slate-600 dark:text-slate-400 hover:border-slate-300 dark:hover:border-slate-700 transition-all select-none" data-filter="swim">🏊 Swim</span>
        </div>

        <!-- ─── GRID ─── -->
        <div id="workoutGrid" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <!-- Cards will be rendered by JS -->
        </div>

        <!-- ─── EMPTY STATE ─── -->
        <div id="emptyState" class="hidden py-16 text-center" style="display:none;">
            <div class="text-5xl mb-4">🤷</div>
            <p class="text-lg text-slate-500 dark:text-slate-400 font-medium">No workouts match your filter.</p>
        </div>

        <!-- ─── FOOTER ─── -->
        <footer class="mt-12 pt-8 border-t border-slate-200 dark:border-slate-800 flex flex-wrap justify-center gap-6 text-sm font-medium text-slate-500 dark:text-slate-400">
            <span class="flex items-center gap-2">💪 <span id="countWorkout">9 workouts</span></span>
            <span class="flex items-center gap-2">📱 tap to open</span>
            <span class="flex items-center gap-2">⚡ more coming</span>
        </footer>

    </div>

    <script>
        (function() {
            'use strict';

            // ─── DATA ──────────────────────────────────────────────
            const workouts = [{
                id: 'leg-day',
                title: 'Leg Day Circuit',
                desc: 'Lower body strength & power – glute bridges, lunges, jump squats.',
                file: 'leg-day-circuit.html',
                type: 'legs',
                tags: ['Lower Body', 'Circuit', 'Power'],
                emoji: '🦵'
            }, {
                id: 'runner',
                title: "Runner's Strength",
                desc: 'Injury prevention & resilience – 10 exercises for runners.',
                file: 'runner-lower-body-workout.html',
                type: 'runner',
                tags: ['Running', 'Injury Prevention', 'Unilateral'],
                emoji: '🏃'
            }{
                id: 'late-stregth',
                title: "The Strength That Shows Up Late ",
                desc: 'A 50-minute gym session for runners.',
                file: 'the_strength_that_shows_up_late.html',
                type: 'runner',
                tags: ['Running', 'Injury Prevention', 'Late Strength'],
                emoji: '🏃'
            },{
                id: 'cyclist',
                title: "Endurance Cyclist – Gym Backup Plan",
                desc: 'Cycling Challenge · weather-proof training',
                file: 'endurance-cyclist-plan.html',
                type: 'cyclist',
                tags: ['Bad Weather', 'Core', 'Posture'],
                emoji: '🚴'
            }, {
                id: 'triathlon',
                title: 'Triathlon S&C',
                desc: 'Strength for swim / bike / run – full body, 4x6 strength range.',
                file: 'triathlon-gym-plan.html',
                type: 'tri',
                tags: ['Triathlon', 'Full Body', 'Strength'],
                emoji: '🚴'
            }, {
                id: 'triathlon2',
                title: 'Triathlon Strength & Conditioning',
                desc: 'Gym support for swim · bike · run',
                file: 'triathlon-strength-conditioning.html',
                type: 'tri',
                tags: ['Triathlon', 'Gym Support', 'Strength'],
                emoji: '🚴'
            },{
                id: 'swimming-pre',
                title: 'Swimming Pre-activation',
                desc: 'dynamic warm‑up · activation · swim‑specific',
                file: 'swim-pre-activation.html',
                type: 'swim',
                tags: ['Swimming', 'Pre-activation', 'Warm-up'],
                emoji: '🏊'
            },{
                id: 'swimmer',
                title: 'Swimmer Gym Plan',
                desc: '13yo · 47kg · safe bulk & swim-specific strength.',
                file: 'swimmer-gym-teen.html',
                type: 'swim',
                tags: ['Swimming', 'Youth', 'Bulking'],
                emoji: '🏊'
            }, {
                id: 'runner-strength',
                title: 'Strength Build up for a Youth Runner',
                desc: 'Run-specific strength. Physio recommended',
                file: 'youth-runner-strength-build-up.html',
                type: 'runner',
                tags: ['Running', 'Youth', 'Strength'],
                emoji: '🏃'
            }, {
                id: 'runner-strength-conditioning',
                title: 'Youth Runner Strength & Conditioning',
                desc: 'Female teen · 51 kg · little prior strength work',
                file: 'youth-runner-strength-conditioning.html',
                type: 'runner',
                tags: ['Running', 'Youth', 'Strength'],
                emoji: '🏃'
            }];

            // ─── DOM refs ──────────────────────────────────────────
            const grid = document.getElementById('workoutGrid');
            const searchInput = document.getElementById('searchInput');
            const filterChips = document.querySelectorAll('.filter-chip');
            const emptyState = document.getElementById('emptyState');
            const countBadge = document.getElementById('countBadge');
            const countWorkout = document.getElementById('countWorkout');

            let activeFilter = 'all';
            let searchQuery = '';

            // ─── Helpers ───────────────────────────────────────────
            function getTypeLabel(type) {
                const map = {
                    legs: '🦵 Legs',
                    runner: '🏃 Runner',
                    tri: '🚴 Tri',
                    cyclist: '🚴 Cyclist',
                    swim: '🏊 Swim',
                    other: '📌 Other'
                };
                return map[type] || '📌 Other';
            }

            function getTypeColor(type) {
                const map = {
                    legs: 'bg-orange-500',
                    runner: 'bg-emerald-500',
                    cyclist: 'bg-rose-500', 
                    tri: 'bg-blue-500',
                    swim: 'bg-violet-500'
                };
                return map[type] || 'bg-slate-500';
            }

            function matchesWorkout(w) {
                // Filter
                if (activeFilter !== 'all' && w.type !== activeFilter) return false;

                // Search (title + desc + tags)
                if (searchQuery.trim() !== '') {
                    const q = searchQuery.trim().toLowerCase();
                    const haystack = (w.title + ' ' + w.desc + ' ' + w.tags.join(' ')).toLowerCase();
                    if (!haystack.includes(q)) return false;
                }

                return true;
            }

            function render() {
                const filtered = workouts.filter(matchesWorkout);
                const count = filtered.length;

                // Update badge
                countBadge.textContent = count + ' plan' + (count !== 1 ? 's' : '');
                countWorkout.textContent = count + ' workout' + (count !== 1 ? 's' : '');
                
                if (count === 0) {
                    grid.innerHTML = '';
                    emptyState.classList.remove('hidden');
                    return;
                }
                emptyState.classList.add('hidden');

                let html = '';
                for (const w of filtered) {
                    const typeLabel = getTypeLabel(w.type);
                    const typeColor = getTypeColor(w.type);

                    // Build tag HTML
                    let tagsHtml = '';
                    const displayTags = w.tags.slice(0, 2);
                    for (const t of displayTags) {
                        tagsHtml += `<span class="px-2.5 py-0.5 rounded-full text-[10px] font-bold uppercase tracking-wider bg-slate-100 dark:bg-slate-800 text-slate-500 dark:text-slate-400 border border-slate-200 dark:border-slate-700">${t}</span>`;
                    }
                    if (w.tags.length > 2) {
                        tagsHtml += `<span class="px-2.5 py-0.5 rounded-full text-[10px] font-bold uppercase tracking-wider bg-slate-100 dark:bg-slate-800 text-slate-500 dark:text-slate-400 border border-slate-200 dark:border-slate-700">+${w.tags.length - 2}</span>`;
                    }

                    html += `
                        <a class="group relative block bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-5 no-underline transition-all hover:scale-[1.02] hover:shadow-xl hover:border-slate-300 dark:hover:border-slate-700 active:scale-[0.98]" href="${w.file}" target="_top">
                            <div class="absolute left-0 top-0 bottom-0 w-1.5 rounded-l-2xl ${typeColor}"></div>
                            <div class="flex justify-between items-start gap-3">
                                <div class="flex-1 min-w-0">
                                    <div class="text-lg font-bold text-slate-900 dark:text-slate-100 leading-tight mb-1 truncate">${w.emoji} ${w.title}</div>
                                    <div class="text-sm text-slate-500 dark:text-slate-400 leading-relaxed mb-3 line-clamp-2">${w.desc}</div>
                                    <div class="flex flex-wrap items-center gap-2 text-xs">
                                        <span class="px-2.5 py-0.5 rounded-full font-bold bg-brand-50 dark:bg-brand-900/20 text-brand-600 dark:text-brand-400 border border-brand-100 dark:border-brand-900/30">${typeLabel}</span>
                                        ${tagsHtml}
                                    </div>
                                </div>
                                <span class="text-2xl text-slate-300 dark:text-slate-700 group-hover:text-brand-500 transition-colors">›</span>
                            </div>
                        </a>
                    `;
                }

                grid.innerHTML = html;
            }

            // ─── Event handlers ────────────────────────────────────

            // Filter chips
            for (const chip of filterChips) {
                chip.addEventListener('click', function(e) {
                    // Update active class
                    for (const c of filterChips) c.classList.remove('active');
                    this.classList.add('active');

                    activeFilter = this.dataset.filter;
                    render();
                });
            }

            // Search input – debounced
            let searchTimer;
            searchInput.addEventListener('input', function() {
                clearTimeout(searchTimer);
                searchTimer = setTimeout(() => {
                    searchQuery = this.value;
                    render();
                }, 180);
            });

            // ─── Initial render ────────────────────────────────────
            render();

            // ─── (Optional) re-render on resize for safety ────────
            let resizeTimer;
            window.addEventListener('resize', function() {
                clearTimeout(resizeTimer);
                resizeTimer = setTimeout(() => {
                    // no-op, but keeps things fresh
                }, 200);
            });

        })();
    </script>

</body>
</html>
