<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>💪 Workout Hub</title>
    <style>
        /* ── Reset & base ── */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, 'Segoe UI', Roboto, system-ui, sans-serif;
            background: #0b0e12;
            color: #e8edf2;
            min-height: 100vh;
            padding: 18px 16px 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 600px;
            width: 100%;
        }

        /* ── Header ── */
        .header {
            margin-bottom: 28px;
            padding-bottom: 16px;
            border-bottom: 2px solid #1f2a36;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            flex-wrap: wrap;
            gap: 6px;
        }

        .header-left h1 {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #f0f4fa 0%, #7ec8f0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.2;
        }

        .header-left .sub {
            font-size: 13px;
            font-weight: 500;
            color: #7a8a9e;
            letter-spacing: 0.3px;
            -webkit-text-fill-color: #7a8a9e;
        }

        .badge-count {
            background: #1f2a36;
            padding: 4px 14px;
            border-radius: 40px;
            font-size: 13px;
            font-weight: 600;
            color: #b0c4d9;
            border: 1px solid #2d3b4a;
            white-space: nowrap;
        }

        /* ── Search / filter ── */
        .search-wrap {
            margin-bottom: 22px;
            position: relative;
        }

        .search-wrap input {
            width: 100%;
            padding: 14px 18px 14px 46px;
            border-radius: 14px;
            border: 1px solid #26313e;
            background: #141b23;
            color: #e8edf2;
            font-size: 16px;
            font-weight: 500;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .search-wrap input::placeholder {
            color: #5e6f82;
            font-weight: 400;
        }

        .search-wrap input:focus {
            border-color: #4a8dcf;
            box-shadow: 0 0 0 3px rgba(74, 141, 207, 0.2);
        }

        .search-wrap .icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 20px;
            opacity: 0.6;
            pointer-events: none;
        }

        /* ── Filter chips ── */
        .filter-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 22px;
        }

        .filter-chip {
            background: #141b23;
            border: 1px solid #26313e;
            padding: 6px 16px;
            border-radius: 40px;
            font-size: 13px;
            font-weight: 500;
            color: #8ea0b5;
            cursor: pointer;
            transition: all 0.15s;
            user-select: none;
            touch-action: manipulation;
        }

        .filter-chip:active {
            transform: scale(0.96);
        }

        .filter-chip.active {
            background: #1f3347;
            border-color: #4a8dcf;
            color: #e8edf2;
            box-shadow: 0 0 0 1px #4a8dcf;
        }

        /* ── Workout grid ── */
        .grid {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        /* ── Card ── */
        .card {
            display: block;
            background: #141b23;
            border: 1px solid #1f2a36;
            border-radius: 18px;
            padding: 18px 20px;
            text-decoration: none;
            color: inherit;
            transition: transform 0.12s, border-color 0.2s, box-shadow 0.2s;
            touch-action: manipulation;
            position: relative;
            overflow: hidden;
        }

        .card:active {
            transform: scale(0.98);
        }

        .card:hover {
            border-color: #33455a;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }

        /* subtle accent stripe */
        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            width: 4px;
            border-radius: 4px 0 0 4px;
        }

        .card.type-legs::before {
            background: #f59e0b;
        }
        .card.type-runner::before {
            background: #10b981;
        }
        .card.type-cyclist::before {
            background: #AA336A;
        }
        .card.type-tri::before {
            background: #3b82f6;
        }
        .card.type-swim::before {
            background: #8b5cf6;
        }
        .card.type-other::before {
            background: #ec4899;
        }

        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
        }

        .card-left {
            flex: 1;
            min-width: 0;
        }

        .card-title {
            font-size: 18px;
            font-weight: 700;
            color: #f0f4fa;
            line-height: 1.25;
            margin-bottom: 3px;
            word-break: break-word;
        }

        .card-desc {
            font-size: 14px;
            color: #8ea0b5;
            line-height: 1.4;
            margin-bottom: 8px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .card-meta {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px 12px;
            font-size: 13px;
            color: #6a7d92;
        }

        .card-meta .tag {
            background: #1f2a36;
            padding: 2px 12px;
            border-radius: 40px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            color: #b0c4d9;
            border: 1px solid #2a3747;
        }

        .card-meta .tag.highlight {
            background: #1f3347;
            border-color: #4a8dcf44;
            color: #7ec8f0;
        }

        .card-arrow {
            font-size: 20px;
            color: #4a5f74;
            flex-shrink: 0;
            margin-top: 2px;
            transition: transform 0.2s, color 0.2s;
        }

        .card:active .card-arrow {
            transform: translateX(4px);
            color: #7ec8f0;
        }

        /* ── Empty state ── */
        .empty {
            text-align: center;
            padding: 50px 20px;
            color: #5e6f82;
        }
        .empty .big {
            font-size: 48px;
            margin-bottom: 12px;
        }
        .empty p {
            font-size: 16px;
        }

        /* ── Footer ── */
        .footer {
            margin-top: 32px;
            padding-top: 18px;
            border-top: 1px solid #1f2a36;
            text-align: center;
            font-size: 14px;
            color: #4a5f74;
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }
        .footer span {
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        /* ── Responsive tweaks ── */
        @media (max-width: 480px) {
            body {
                padding: 12px 12px 32px;
            }
            .header-left h1 {
                font-size: 22px;
            }
            .card {
                padding: 15px 16px;
            }
            .card-title {
                font-size: 16px;
            }
            .card-desc {
                font-size: 13px;
            }
            .filter-chip {
                font-size: 12px;
                padding: 5px 14px;
            }
            .search-wrap input {
                font-size: 15px;
                padding: 12px 14px 12px 42px;
            }
        }

        @media (min-width: 768px) {
            .grid {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 16px;
            }
            .card {
                padding: 20px 22px;
            }
            .card::before {
                width: 5px;
            }
        }

        /* ── Print friendly ── */
        @media print {
            body {
                background: white;
                color: #111;
                padding: 0.5in;
            }
            .card {
                border-color: #ccc;
                background: #f9f9f9;
                break-inside: avoid;
            }
            .card::before {
                display: none;
            }
            .search-wrap,
            .filter-row,
            .badge-count,
            .footer {
                display: none !important;
            }
            .header {
                border-bottom-color: #ccc;
            }
            .header-left h1 {
                -webkit-text-fill-color: #111;
                color: #111;
                background: none;
            }
            .header-left .sub {
                -webkit-text-fill-color: #555;
                color: #555;
            }
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- ─── HEADER ─── -->
        <header class="header">
            <div class="header-left">
                <h1>🏋️ Workout Hub</h1>
                <div class="sub">Tap a plan &amp; hit the gym</div>
            </div>
            <div class="badge-count" id="countBadge">4 plans</div>
        </header>

        <!-- ─── SEARCH ─── -->
        <div class="search-wrap">
            <span class="icon">🔍</span>
            <input type="text" id="searchInput" placeholder="Search workouts…" autocomplete="off" />
        </div>

        <!-- ─── FILTERS ─── -->
        <div class="filter-row" id="filterRow">
            <span class="filter-chip active" data-filter="all">All</span>
            <span class="filter-chip" data-filter="legs">🦵 Legs</span>
            <span class="filter-chip" data-filter="runner">🏃 Runner</span>
            <span class="filter-chip" data-filter="tri">🚴 Tri</span>
            <span class="filter-chip" data-filter="cyclist">🚴 Cyclist</span>
            <span class="filter-chip" data-filter="swim">🏊 Swim</span>
        </div>

        <!-- ─── GRID ─── -->
        <div class="grid" id="workoutGrid">
            <!-- Cards will be rendered by JS -->
        </div>

        <!-- ─── EMPTY STATE ─── -->
        <div class="empty" id="emptyState" style="display:none;">
            <div class="big">🤷</div>
            <p>No workouts match your filter.</p>
        </div>

        <!-- ─── FOOTER ─── -->
        <div class="footer">
            <span>💪 <span id="countWorkout">5 workouts</span></span>
            <span>📱 tap to open</span>
            <span>⚡ more coming</span>
        </div>

    </div>

    <script>
        (function() {
            'use strict';

            // ─── DATA ──────────────────────────────────────────────
            const workouts = [{
                id: 'leg-day',
                title: 'Leg Day Circuit',
                desc: 'Lower body strength & power – glute bridges, lunges, jump squats.',
                file: 'Short_Leg_day.html',
                type: 'legs',
                tags: ['Lower Body', 'Circuit', 'Power'],
                emoji: '🦵'
            }, {
                id: 'runner',
                title: "Runner's Strength",
                desc: 'Injury prevention & resilience – 10 exercises for runners.',
                file: 'Runners_lower_body_workout.html',
                type: 'runner',
                tags: ['Running', 'Injury Prevention', 'Unilateral'],
                emoji: '🏃'
            },{
                id: 'cyclist',
                title: "Endurance Cyclist – Gym Backup Plan",
                desc: 'Cycling Challenge · weather-proof training',
                file: 'endurance_cyclist_plan.html',
                type: 'cyclist',
                tags: ['Bad Weather', 'Core', 'Posture'],
                emoji: '🚴'
            }, {
                id: 'triathlon',
                title: 'Triathlon S&C',
                desc: 'Strength for swim / bike / run – full body, 4x6 strength range.',
                file: 'Triathlon S&C plan_260818_090116.html',
                type: 'tri',
                tags: ['Triathlon', 'Full Body', 'Strength'],
                emoji: '🚴'
            }, {
                id: 'triathlon2',
                title: 'Triathlon Strength & Conditioning',
                desc: 'Gym support for swim · bike · run',
                file: 'gym-workouts.html',
                type: 'tri',
                tags: ['Triathlon', 'Gym Support', 'Strength'],
                emoji: '🚴'
            },{
                id: 'swimming-pre',
                title: 'Swimming Pre-activation',
                desc: 'dynamic warm‑up · activation · swim‑specific',
                file: 'swim-pre-activation.html',
                type: 'swim',
                tags: ['Swimming', 'Pre-activation', 'Warm-up'],
                emoji: '🏊'
            },{
                id: 'swimmer',
                title: 'Swimmer Gym Plan',
                desc: '13yo · 47kg · safe bulk & swim-specific strength.',
                file: 'Teen_workout_plan.html',
                type: 'swim',
                tags: ['Swimming', 'Youth', 'Bulking'],
                emoji: '🏊'
            }, {
                id: 'runner-strength',
                title: 'Strength  Build up for a Youth Runner',
                desc: 'Run-specific strength. Physio recommended',
                file: 'strength-build-up-young-runner.html',
                type: 'runner',
                tags: ['Running', 'Youth', 'Strength'],
                emoji: '🏃'
            }, {
                id: 'runner-strength-conditioning',
                title: 'Youth Runner Strength & Conditioning',
                desc: 'Female teen · 51 kg · little prior strength work',
                file: 'Strength_and_Conditioning_Youth_Runner.html',
                type: 'runner',
                tags: ['Running', 'Youth', 'Strength'],
                emoji: '🏃'
            }];

            // ─── DOM refs ──────────────────────────────────────────
            const grid = document.getElementById('workoutGrid');
            const searchInput = document.getElementById('searchInput');
            const filterChips = document.querySelectorAll('.filter-chip');
            const emptyState = document.getElementById('emptyState');
            const countBadge = document.getElementById('countBadge');

            let activeFilter = 'all';
            let searchQuery = '';

            // ─── Helpers ───────────────────────────────────────────
            function getTypeLabel(type) {
                const map = {
                    legs: '🦵 Legs',
                    runner: '🏃 Runner',
                    tri: '🚴 Tri',
                    cyclist: '🚴 Cyclist',
                    swim: '🏊 Swim',
                    other: '📌 Other'
                };
                return map[type] || '📌 Other';
            }

            function getTypeClass(type) {
                const map = {
                    legs: 'type-legs',
                    runner: 'type-runner',
                    cyclist: 'type-cyclist', 
                    tri: 'type-tri',
                    swim: 'type-swim'
                };
                return map[type] || 'type-other';
            }

            function matchesWorkout(w) {
                // Filter
                if (activeFilter !== 'all' && w.type !== activeFilter) return false;

                // Search (title + desc + tags)
                if (searchQuery.trim() !== '') {
                    const q = searchQuery.trim().toLowerCase();
                    const haystack = (w.title + ' ' + w.desc + ' ' + w.tags.join(' ')).toLowerCase();
                    if (!haystack.includes(q)) return false;
                }

                return true;
            }

            function render() {
                const filtered = workouts.filter(matchesWorkout);
                const count = filtered.length;

                // Update badge
                countBadge.textContent = count + ' plan' + (count !== 1 ? 's' : '');
                countWorkout.textContent = count + ' workout' + (count !== 1 ? 's' : '');
                
                if (count === 0) {
                    grid.innerHTML = '';
                    emptyState.style.display = 'block';
                    return;
                }
                emptyState.style.display = 'none';

                let html = '';
                for (const w of filtered) {
                    const typeLabel = getTypeLabel(w.type);
                    const typeClass = getTypeClass(w.type);

                    // Build tag HTML
                    let tagsHtml = '';
                    // show first 2 tags as small pills
                    const displayTags = w.tags.slice(0, 2);
                    for (const t of displayTags) {
                        tagsHtml += `<span class="tag">${t}</span>`;
                    }
                    // if there are more, show +N
                    if (w.tags.length > 2) {
                        tagsHtml += `<span class="tag">+${w.tags.length - 2}</span>`;
                    }

                    html += `
                        <a class="card ${typeClass}" href="${w.file}" target="_top">
                            <div class="card-top">
                                <div class="card-left">
                                    <div class="card-title">${w.emoji} ${w.title}</div>
                                    <div class="card-desc">${w.desc}</div>
                                    <div class="card-meta">
                                        <span class="tag highlight">${typeLabel}</span>
                                        ${tagsHtml}
                                    </div>
                                </div>
                                <span class="card-arrow">›</span>
                            </div>
                        </a>
                    `;
                }

                grid.innerHTML = html;
            }

            // ─── Event handlers ────────────────────────────────────

            // Filter chips
            for (const chip of filterChips) {
                chip.addEventListener('click', function(e) {
                    // Update active class
                    for (const c of filterChips) c.classList.remove('active');
                    this.classList.add('active');

                    activeFilter = this.dataset.filter;
                    render();
                });
            }

            // Search input – debounced
            let searchTimer;
            searchInput.addEventListener('input', function() {
                clearTimeout(searchTimer);
                searchTimer = setTimeout(() => {
                    searchQuery = this.value;
                    render();
                }, 180);
            });

            // ─── Initial render ────────────────────────────────────
            render();

            // ─── (Optional) re-render on resize for safety ────────
            let resizeTimer;
            window.addEventListener('resize', function() {
                clearTimeout(resizeTimer);
                resizeTimer = setTimeout(() => {
                    // no-op, but keeps things fresh
                }, 200);
            });

        })();
    </script>

</body>
</html>
